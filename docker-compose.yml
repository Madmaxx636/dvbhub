# dvbhub — pulls the prebuilt image from GitHub Container Registry.
#   docker compose up -d        # install / start
#   docker compose pull && docker compose up -d   # update
services:
  dvbhub:
    image: ghcr.io/madmaxx636/dvbhub:latest
    # To build from source instead of pulling, replace "image:" with:
    # build: https://github.com/Madmaxx636/dvbhub.git
    container_name: dvbhub
    restart: unless-stopped
    # Host networking lets Jellyfin/Plex find dvbhub via SSDP and keeps
    # stream URLs identical inside and outside Docker. Without it, remove this
    # line and uncomment "ports" (then enter the tuner URL by hand).
    network_mode: host
    # ports:
    #   - "9980:9980"
    volumes:
      - ./data:/data
      # Read-only views of the host's firmware and kernel modules, so the
      # Hardware page can tell which tuner firmware is missing.
      - /lib/firmware:/lib/firmware:ro
      - /lib/modules:/lib/modules:ro
      # DVB tuners. /dev is shared so dvbhub starts even when no tuner is
      # plugged in and sees tuners plugged in later; the rule below only lets
      # it use DVB devices (character major 212), nothing else on the host.
      - /dev:/dev
    device_cgroup_rules:
      - "c 212:* rmw"
    # Uncomment to let dvbhub see which host programs (e.g. Tvheadend) hold a tuner:
    # pid: host
    environment:
      - TZ=Europe/London          # set yours; the EPG and guide use local time
      # - DVBHUB_PASSWORD=change-me  # protect the admin UI (streams stay open)
    # NVIDIA GPU for NVENC/NVDEC. Requires the NVIDIA Container Toolkit on the
    # host. Delete this block if you have no NVIDIA GPU.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, video, compute, utility]
