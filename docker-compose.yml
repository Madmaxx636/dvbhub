# dvbhub: pulls the ready-made image from GitHub.
#   docker compose up -d       start (and install)
#   docker compose pull        then "docker compose up -d" again to update
services:
  dvbhub:
    image: ghcr.io/madmaxx636/dvbhub:latest
    container_name: dvbhub
    restart: unless-stopped
    # Host networking lets Jellyfin and Plex find dvbhub automatically and
    # keeps stream addresses the same inside and outside Docker.
    network_mode: host
    volumes:
      - ./data:/data                       # channels, settings, guide
      # Read-only views of the host's firmware and kernel modules, so the
      # Tuners page can tell which firmware is missing.
      - /lib/firmware:/lib/firmware:ro
      - /lib/modules:/lib/modules:ro
      # /dev is shared so dvbhub also sees tuners plugged in after it started.
      # The rules below only allow TV tuners (212) and GPUs (226).
      - /dev:/dev
    device_cgroup_rules:
      - "c 212:* rmw"
      - "c 226:* rmw"
    environment:
      - TZ=America/New_York          # your time zone (only affects log times)
      # - DVBHUB_PASSWORD=change-me  # protect the web page; Jellyfin's streams stay open
    # Uncomment to let dvbhub see which host programs (e.g. Tvheadend) hold a tuner:
    # pid: host
    #
    # NVIDIA GPU: see docker-compose.nvidia.yml. Intel and AMD GPUs work as is.
