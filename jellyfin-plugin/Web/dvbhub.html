<div id="dvbhubPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-button,emby-input">
<div data-role="content">
<div class="content-primary">

<style>
#dvbhubPage .dhp-bar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:0 0 6px; padding:0 16px; }
#dvbhubPage .dhp-bar h2 { margin:0; }
#dvbhubPage .dhp-sp { flex:1; }
#dvbhubPage .dhp-state { font-size:.85em; opacity:.8; }
#dvbhubPage .dhp-btn { font:inherit; font-size:.9em; padding:6px 12px; border-radius:6px; border:1px solid rgba(128,128,128,.35); background:rgba(128,128,128,.12); color:inherit; cursor:pointer; text-decoration:none; }
#dvbhubPage .dhp-btn.pri { background:#00a4dc; border-color:#00a4dc; color:#fff; }
#dvbhubPage .dhp-conn { margin:0 16px 14px; padding:14px; border-radius:10px; background:rgba(128,128,128,.09); border:1px solid rgba(128,128,128,.28); }
#dvbhubPage .dhp-conn label { display:flex; flex-direction:column; gap:4px; font-size:.85em; font-weight:600; flex:1; min-width:220px; }
#dvbhubPage .dhp-conn input { font:inherit; font-weight:400; color:inherit; background:rgba(0,0,0,.18); border:1px solid rgba(128,128,128,.35); border-radius:6px; padding:7px 9px; }
#dvbhubPage .dhp-row { display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; }
#dvbhubPage .dhp-note { font-size:.85em; opacity:.75; margin:8px 0 0; }
#dvbhubPage .dhp-err { color:#ff6b6b; }
</style>

<div class="dhp-bar">
  <h2>TV Tuners</h2>
  <span class="dhp-state" id="dhpState"></span>
  <span class="dhp-sp"></span>
  <a class="dhp-btn" id="dhpOpen" target="_blank" rel="noopener" style="display:none">Open dvbhub ↗</a>
  <button class="dhp-btn" id="dhpConnBtn" type="button">Connection</button>
</div>

<div class="dhp-conn" id="dhpConn" style="display:none">
  <div class="dhp-row">
    <label>dvbhub address<input id="dhpUrl" type="url" placeholder="http://192.168.1.10:9980" autocomplete="off"></label>
    <label>dvbhub password<input id="dhpPw" type="password" placeholder="(none)" autocomplete="new-password"></label>
    <button class="dhp-btn pri" id="dhpSave" type="button">Save and connect</button>
  </div>
  <p class="dhp-note">The address of dvbhub as the Jellyfin server sees it: usually the server's IP address and port 9980. The password is only needed if you gave dvbhub one.</p>
  <p class="dhp-note" id="dhpResult"></p>
</div>

<div id="dhpMount"></div>

</div>
</div>

<script type="text/javascript">
(function () {
    var pluginId = '7b1e4c2a-5d3f-4e8b-9a61-2c0f8d9e4b17';
    var page = document.querySelector('#dvbhubPage');
    var config = null, app = null;

    function $(sel) { return page.querySelector(sel); }
    function authHeaders(extra) {
        var hd = { 'Authorization': 'MediaBrowser Token="' + ApiClient.accessToken() + '"' };
        Object.keys(extra || {}).forEach(function (k) { hd[k] = extra[k]; });
        return hd;
    }
    function call(method, path, body) {
        var opts = { method: method, headers: authHeaders() };
        if (body !== undefined && method !== 'GET') {
            if (typeof body === 'string') { opts.body = body; opts.headers['Content-Type'] = 'text/plain'; }
            else { opts.body = JSON.stringify(body); opts.headers['Content-Type'] = 'application/json'; }
        }
        return fetch(ApiClient.getUrl('DvbHub/Api/' + path), opts).then(function (r) {
            return r.text().then(function (t) {
                var d = null;
                try { d = t ? JSON.parse(t) : null; } catch (e) { d = t; }
                if (!r.ok) throw new Error((d && d.error) || t || r.statusText);
                return d;
            });
        });
    }
    function fetchText(path) {
        return fetch(ApiClient.getUrl(path), { headers: authHeaders() }).then(function (r) {
            return r.text().then(function (t) {
                if (!r.ok) { var m = t; try { m = JSON.parse(t).error || t; } catch (e) { } throw new Error(m || r.statusText); }
                return t;
            });
        });
    }
    function norm(u) { return String(u || '').trim().replace(/\/+$/, '').toLowerCase(); }

    // Jellyfin's own Live TV API: add dvbhub as an HDHomeRun tuner plus its XMLTV guide.
    var jellyfin = {
        addToLiveTv: function (url, xmltv, name) {
            return ApiClient.getNamedConfiguration('livetv').then(function (lt) {
                var hosts = lt.TunerHosts || [], provs = lt.ListingProviders || [], jobs = [], did = [];
                if (!hosts.some(function (x) { return norm(x.Url) === norm(url); })) {
                    jobs.push(ApiClient.ajax({ type: 'POST', url: ApiClient.getUrl('LiveTv/TunerHosts'), contentType: 'application/json',
                        data: JSON.stringify({ Type: 'hdhomerun', Url: url, FriendlyName: name || 'dvbhub', ImportFavoritesOnly: false, AllowHWTranscoding: true,
                            AllowStreamSharing: true, EnableStreamLooping: false, IgnoreDts: true, TunerCount: 0 }) }));
                    did.push('tuner');
                }
                if (!provs.some(function (x) { return x.Type === 'xmltv' && norm(x.Path) === norm(xmltv); })) {
                    jobs.push(ApiClient.ajax({ type: 'POST', url: ApiClient.getUrl('LiveTv/ListingProviders', { validateListings: false, validateLogin: false }), contentType: 'application/json',
                        data: JSON.stringify({ Type: 'xmltv', Path: xmltv, EnableAllTuners: true }) }));
                    did.push('guide');
                }
                if (!jobs.length) return 'Already in Jellyfin Live TV.';
                return Promise.all(jobs).then(function () {
                    return 'Added the ' + did.join(' and ') + ' to Jellyfin Live TV. Channels appear under Live TV in a minute or two.';
                });
            });
        },
        status: function (url) {
            return ApiClient.getNamedConfiguration('livetv').then(function (lt) {
                var on = (lt.TunerHosts || []).some(function (x) { return norm(x.Url) === norm(url); });
                return on ? 'dvbhub is in Jellyfin Live TV.' : 'Not added to Live TV yet.';
            });
        }
    };

    // The colour behind Jellyfin's pages, for dvbhub's dialogs.
    function pageBackground() {
        for (var el = page; el; el = el.parentElement) {
            var c = getComputedStyle(el).backgroundColor;
            if (c && c !== 'transparent' && c.indexOf('rgba(0, 0, 0, 0)') !== 0) return c;
        }
        return getComputedStyle(document.body).backgroundColor || '#202020';
    }

    function showConn(on) { $('#dhpConn').style.display = on ? '' : 'none'; }
    function setState(text, bad) { var s = $('#dhpState'); s.textContent = text; s.className = 'dhp-state' + (bad ? ' dhp-err' : ''); }

    function loadUI() {
        if (app) { try { app.destroy(); } catch (e) { } app = null; }
        var mount = $('#dhpMount');
        mount.textContent = 'Loading…';
        return Promise.all([fetchText('DvbHub/Ui/app.css'), fetchText('DvbHub/Ui/app.js')]).then(function (r) {
            var style = document.getElementById('dvbhub-ui-css');
            if (!style) { style = document.createElement('style'); style.id = 'dvbhub-ui-css'; document.head.appendChild(style); }
            style.textContent = r[0];
            (new Function(r[1]))();
            var host = { embedded: true, api: call, jellyfin: jellyfin, modalBg: pageBackground() };
            return window.DvbHubUI.mount(mount, host).then(function (a) {
                app = a;
                setState(a.status ? 'Connected to ' + config.DvbHubUrl + ' · dvbhub ' + a.status.version : 'Not connected', !a.status);
                if (!a.status) showConn(true);
            });
        }).catch(function (e) {
            mount.textContent = '';
            setState('Not connected: ' + e.message, true);
            showConn(true);
        });
    }

    function save() {
        var url = $('#dhpUrl').value.trim().replace(/\/+$/, '');
        if (url && !/^https?:\/\//i.test(url)) url = 'http://' + url;
        config.DvbHubUrl = url;
        config.AdminPassword = $('#dhpPw').value;
        $('#dhpResult').textContent = 'Connecting…';
        return ApiClient.updatePluginConfiguration(pluginId, config).then(function () {
            $('#dhpUrl').value = url;
            $('#dhpOpen').href = url; $('#dhpOpen').style.display = url ? '' : 'none';
            return call('GET', 'status').then(function (st) {
                $('#dhpResult').textContent = 'Connected: ' + st.tuners.length + ' tuner(s), ' + st.counts.channels + ' channel(s).';
                showConn(false);
                return loadUI();
            });
        }).catch(function (e) { $('#dhpResult').innerHTML = ''; var s = document.createElement('span'); s.className = 'dhp-err'; s.textContent = 'Could not connect: ' + e.message; $('#dhpResult').appendChild(s); });
    }

    $('#dhpConnBtn').addEventListener('click', function () { showConn($('#dhpConn').style.display === 'none'); });
    $('#dhpSave').addEventListener('click', save);

    page.addEventListener('pageshow', function () {
        ApiClient.getPluginConfiguration(pluginId).then(function (c) {
            config = c;
            var url = config.DvbHubUrl || '';
            $('#dhpUrl').value = url || ('http://' + window.location.hostname + ':9980');
            $('#dhpPw').value = config.AdminPassword || '';
            $('#dhpOpen').href = url; $('#dhpOpen').style.display = url ? '' : 'none';
            if (!url) {
                setState('Not set up yet');
                showConn(true);
                $('#dhpResult').textContent = 'Check the address, then press Save and connect.';
                return;
            }
            setState('Connecting to ' + url + '…');
            return loadUI();
        });
    });
    page.addEventListener('pagehide', function () {
        if (app) { try { app.destroy(); } catch (e) { } app = null; }
    });
})();
</script>
</div>
