<div id="dvbhubPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-select,emby-checkbox">
<div data-role="content">
<div class="content-primary">

<style>
#dvbhubPage .dh { --dh-line: rgba(128,128,128,.25); --dh-panel: rgba(128,128,128,.08); --dh-good: #2ecc71; --dh-ok: #9bd14a; --dh-warn: #f0b429; --dh-bad: #ff6b6b; --dh-accent: #00a4dc; }
#dvbhubPage .dh-head { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:8px; }
#dvbhubPage .dh-head h2 { margin:0; }
#dvbhubPage .dh-conn { font-size:.85em; opacity:.8; }
#dvbhubPage .dh-tabs { display:flex; gap:4px; flex-wrap:wrap; border-bottom:1px solid var(--dh-line); margin:10px 0 16px; }
#dvbhubPage .dh-tabs button { background:none; border:none; color:inherit; padding:10px 14px; cursor:pointer; opacity:.7; border-bottom:2px solid transparent; font:inherit; }
#dvbhubPage .dh-tabs button.on { opacity:1; border-bottom-color:var(--dh-accent); }
#dvbhubPage .dh-grid { display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); }
#dvbhubPage .dh-card { background:var(--dh-panel); border:1px solid var(--dh-line); border-radius:12px; padding:14px; margin-bottom:14px; }
#dvbhubPage .dh-row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
#dvbhubPage .dh-sp { flex:1; }
#dvbhubPage .dh-muted { opacity:.65; }
#dvbhubPage .dh-small { font-size:.85em; }
#dvbhubPage .dh-mono { font-family:monospace; font-size:.85em; word-break:break-all; }
#dvbhubPage .dh-badge { display:inline-block; padding:1px 9px; border-radius:99px; font-size:.8em; font-weight:600; background:var(--dh-line); white-space:nowrap; }
#dvbhubPage .dh-good { background:rgba(46,204,113,.2); color:var(--dh-good); }
#dvbhubPage .dh-warnb { background:rgba(240,180,41,.2); color:var(--dh-warn); }
#dvbhubPage .dh-badb { background:rgba(255,107,107,.2); color:var(--dh-bad); }
#dvbhubPage .dh-acc { background:rgba(0,164,220,.2); color:var(--dh-accent); }
#dvbhubPage .dh-big { font-size:2em; font-weight:700; font-variant-numeric:tabular-nums; }
#dvbhubPage .dh-huge { font-size:4.2em; font-weight:800; font-variant-numeric:tabular-nums; line-height:1; }
#dvbhubPage .dh-bar { height:8px; border-radius:99px; background:var(--dh-line); overflow:hidden; margin-top:4px; }
#dvbhubPage .dh-bar i { display:block; height:100%; border-radius:99px; transition:width .3s; }
#dvbhubPage table.dh-t { width:100%; border-collapse:collapse; }
#dvbhubPage table.dh-t th, #dvbhubPage table.dh-t td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--dh-line); vertical-align:middle; }
#dvbhubPage table.dh-t th { font-size:.8em; opacity:.7; }
#dvbhubPage .dh-wrap { overflow-x:auto; }
#dvbhubPage .dh-btn { font:inherit; font-size:.9em; padding:6px 12px; border-radius:6px; border:1px solid var(--dh-line); background:var(--dh-panel); color:inherit; cursor:pointer; }
#dvbhubPage .dh-btn.pri { background:var(--dh-accent); border-color:var(--dh-accent); color:#fff; }
#dvbhubPage .dh-btn.red { color:var(--dh-bad); }
#dvbhubPage .dh-in { font:inherit; padding:6px 8px; border-radius:6px; border:1px solid var(--dh-line); background:rgba(0,0,0,.15); color:inherit; }
#dvbhubPage .dh-lock { font-weight:800; font-size:1.3em; padding:6px 14px; border-radius:10px; }
#dvbhubPage pre.dh-log { background:rgba(0,0,0,.25); padding:10px; border-radius:8px; max-height:340px; overflow:auto; white-space:pre-wrap; font-size:.8em; }
#dvbhubPage .dh-sub { display:flex; gap:8px; align-items:center; padding:5px 0; border-top:1px solid var(--dh-line); font-size:.9em; }
#dvbhubPage .dh-err { background:rgba(255,107,107,.15); color:var(--dh-bad); padding:10px 12px; border-radius:8px; margin-bottom:12px; }
#dvbhubPage .dh-live { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--dh-good); margin-left:6px; }
#dvbhubPage label.dh-f { display:flex; flex-direction:column; gap:4px; font-size:.8em; opacity:.9; }
#dvbhubPage .dh-form { display:grid; gap:12px; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); align-items:end; }
</style>

<div class="dh">
  <div class="dh-head">
    <h2>TV Tuners</h2>
    <span class="dh-conn" id="dhConn"></span>
    <span class="dh-sp"></span>
    <a class="dh-btn" id="dhOpenFull" target="_blank" rel="noopener">Open full dvbhub UI ↗</a>
  </div>
  <div class="dh-tabs" id="dhTabs"></div>
  <div id="dhErr"></div>
  <div id="dhView"></div>
</div>

</div>
</div>

<script type="text/javascript">
(function () {
    var pluginId = '7b1e4c2a-5d3f-4e8b-9a61-2c0f8d9e4b17';
    var page = document.querySelector('#dvbhubPage');
    var config = null, timer = null, cleanup = null, currentTab = 'overview';

    // ---------- helpers ----------
    function h(tag, attrs) {

            else if (k === 'value') el.value = v;

        return el;
    }
    function add(el, k) {
        if (k === undefined || k === null || k === false) return;
        if (Array.isArray(k)) { k.forEach(function (x) { add(el, x); }); return; }
        el.appendChild(k instanceof Node ? k : document.createTextNode(String(k)));
    }
    // Like el.replaceChildren(...) but skips null/false entries and flattens arrays.
    function fill(el) {
        el.replaceChildren();
        for (var i = 1; i < arguments.length; i++) add(el, arguments[i]);
        return el;
    }
    var NS = 'http://www.w3.org/2000/svg';
    function svg(tag, attrs) { var el = document.createElementNS(NS, tag); Object.keys(attrs || {}).forEach(function (k) { el.setAttribute(k, attrs[k]); }); return el; }
    function $(sel) { return page.querySelector(sel); }
    function toast(msg) { if (window.Dashboard && Dashboard.alert) Dashboard.alert(msg); else alert(msg); }
    function fmtKbps(k) { return k >= 1000 ? (k / 1000).toFixed(1) + ' Mbit/s' : Math.round(k || 0) + ' kbit/s'; }

    function fmtTime(d) { return new Date(d).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }

    // All dvbhub calls go through Jellyfin (admin only): /DvbHub/Api/<path>.
    function api(method, path, body) {

            return r.text().then(function (t) {
                var d = null; try { d = t ? JSON.parse(t) : null; } catch (e) { d = t; }

    }
    function get(path) { return api('GET', path); }
    function act(p, okMsg) {

    function showErr(e) {

    }

    // Phone-style bars from a signal snapshot {bars, locked, snrDb, strengthPct, live}.
    function bars(snap, size) {
        size = size || 18;
        var n = snap ? snap.bars : -1;
        var col = n <= 1 ? 'var(--dh-bad)' : n === 2 ? 'var(--dh-warn)' : n === 3 ? 'var(--dh-ok)' : 'var(--dh-good)';
        var s = svg('svg', { viewBox: '0 0 20 16', width: size * 1.25, height: size });
        for (var i = 0; i < 4; i++) s.appendChild(svg('rect', { x: i * 5, y: 12 - i * 4, width: 3.6, height: 4 + i * 4, rx: 1, fill: snap && i < n ? col : 'var(--dh-line)' }));
        var label = !snap ? '–' : snap.snrDb != null ? snap.snrDb.toFixed(1) + ' dB' : snap.locked ? (snap.quality || '') : 'no lock';
        var title = !snap ? 'no reading yet' : [snap.locked ? 'locked' : 'no lock', snap.strengthPct >= 0 ? 'strength ' + Math.round(snap.strengthPct) + '%' : '', snap.live ? 'live' : (snap.at ? 'measured ' + fmtDate(snap.at) : '')].filter(Boolean).join(' · ');
        return h('span', { class: 'dh-row', style: 'gap:4px;display:inline-flex', title: title }, s, h('span', { class: 'dh-small' + (snap && snap.live ? '' : ' dh-muted') }, label), snap && snap.live ? h('span', { class: 'dh-live' }) : null);
    }

    // ---------- tabs ----------
    var tabs = [['overview', 'Overview'], ['channels', 'Channels'], ['scan', 'Scan'], ['align', 'Align'], ['transcode', 'Transcoding'], ['hardware', 'Hardware'], ['setup', 'Setup']];
    function renderTabs() {
        $('#dhTabs').replaceChildren.apply($('#dhTabs'), tabs.map(function (t) {
            return h('button', { class: t[0] === currentTab ? 'on' : '', onclick: function () { show(t[0]); } }, t[1]);
        }));
    }
    function show(tab) {
        currentTab = tab;
        clearInterval(timer); timer = null;

        Promise.resolve(views[tab]()).then(function () { showErr(null); }).catch(function (e) { showErr(e); fill($('#dhView'),); });
    }
    function every(ms, fn) { clearInterval(timer); fn(); timer = setInterval(fn, ms); }

    var views = {};

    // ---------- overview ----------
    views.overview = function () {
        var grid = h('div', { class: 'dh-grid' });
        var sum = h('div', { class: 'dh-small dh-muted', style: 'margin-bottom:10px' });

        return new Promise(function (resolve, reject) {
            var first = true;

    };
    function tunerCard(t) {

        var q = idle ? 'idle' : t.quality;
        var qc = { excellent: 'dh-good', good: 'dh-good', fair: 'dh-warnb', poor: 'dh-badb', 'no-lock': 'dh-badb' }[q] || '';

            h('div', { class: 'dh-row' },
                h('div', {}, h('b', {}, t.config.name || t.name), ' ', h('span', { class: 'dh-muted dh-small' }, t.key),
                    h('div', { class: 'dh-small dh-muted' }, idle ? (t.config.enabled ? 'Idle' : 'Disabled') : t.mux)),
                h('span', { class: 'dh-sp' }),
                idle ? null : bars({ bars: t.bars, locked: sg.locked, snrDb: sg.snrDb, strengthPct: sg.strengthPct, live: true }, 24),
                h('span', { class: 'dh-badge ' + qc }, q)),
            t.hold === 'held' ? h('div', { class: 'dh-small', style: 'margin-top:6px' }, h('span', { class: 'dh-badge dh-good' }, '🔒 held by dvbhub')) : null,
            t.hold && t.hold.indexOf('blocked') === 0 ? h('div', { class: 'dh-small', style: 'margin-top:6px' }, h('span', { class: 'dh-badge dh-badb' }, '⚠ ' + t.hold)) : null,
            (t.users || []).length ? h('div', { class: 'dh-small', style: 'margin-top:6px' }, h('span', { class: 'dh-badge dh-warnb' }, 'also open in: ' + t.users.map(function (u) { return u.name + ' (' + u.pid + ')'; }).join(', '))) : null);
        if (!idle) {
            var snrPct = sg.snrDb != null ? sg.snrDb * 100 / 30 : sg.snrPct;
            card.appendChild(h('div', { class: 'dh-row', style: 'margin-top:12px;gap:24px' },
                h('div', { style: 'flex:1' }, h('div', { class: 'dh-small dh-muted' }, 'Strength'),
                    h('div', { class: 'dh-big' }, sg.strengthPct >= 0 ? Math.round(sg.strengthPct) + '%' : '–'),
                    h('div', { class: 'dh-bar' }, h('i', { style: 'width:' + Math.max(0, sg.strengthPct) + '%;background:' + levelColor(sg.strengthPct) }))),
                h('div', { style: 'flex:1' }, h('div', { class: 'dh-small dh-muted' }, 'Quality (SNR)'),
                    h('div', { class: 'dh-big' }, sg.snrDb != null ? sg.snrDb.toFixed(1) + ' dB' : (sg.snrPct >= 0 ? Math.round(sg.snrPct) + '%' : '–')),
                    h('div', { class: 'dh-bar' }, h('i', { style: 'width:' + Math.max(0, snrPct) + '%;background:' + levelColor(snrPct) })))));
            card.appendChild(h('div', { class: 'dh-small dh-muted', style: 'margin-top:8px' },
                'Errors: ' + (sg.unc || 0) + ' uncorrected · ' + (t.ccErrors + t.teiErrors) + ' stream · ' + fmtKbps(t.kbps)));
            if (t.state === 'nosignal') card.appendChild(h('div', { class: 'dh-err', style: 'margin:8px 0 0' }, 'Signal lost ' + Math.round(t.outageSeconds) + ' s — viewers kept connected, re-tuned ' + t.retunes + '×'));
            (t.subscriptions || []).forEach(function (s) {
                var tx = s.transcode;
                card.appendChild(h('div', { class: 'dh-sub' },
                    h('span', { class: 'dh-badge dh-acc' }, s.weight >= 100 ? 'Live' : s.weight >= 10 ? 'Scan' : 'EPG'),
                    h('div', { style: 'flex:1' }, h('b', {}, s.service || s.name), ' → ', s.client || s.name,
                        h('div', { class: 'dh-small dh-muted' }, (s.profile || 'raw') + ' · ' + fmtBytes(s.bytesOut) + (tx ? ' · ' + tx.encoder + ' ' + fmtKbps(tx.outKbps) + ' / target ' + fmtKbps(tx.targetKbps) : '') + (s.failovers ? ' · ' + s.failovers + ' failover(s)' : ''))),
                    h('button', { class: 'dh-btn red', title: 'Stop', onclick: function () { act(api('DELETE', 'subscriptions/' + s.id), 'Stopped'); } }, '✕')));
            });
        }
        return card;
    }

    // ---------- channels ----------
    views.channels = function () {
        return Promise.all([get('channels'), get('profiles')]).then(function (res) {
            var chans = res[0] || [], profs = res[1] || [];
            var q = h('input', { class: 'dh-in', placeholder: 'Filter channels…', style: 'min-width:220px' });
            var tbody = h('tbody');
            function render() {
                var f = q.value.toLowerCase();
                tbody.replaceChildren.apply(tbody, chans.filter(function (c) { return !f || c.name.toLowerCase().indexOf(f) >= 0 || String(c.number) === f; }).map(function (c) {
                    var num = h('input', { class: 'dh-in', type: 'number', value: c.number, style: 'width:70px' });
                    var name = h('input', { class: 'dh-in', value: c.name, style: 'width:170px' });
                    var en = h('input', { type: 'checkbox', checked: c.enabled });
                    var prof = h('select', { class: 'dh-in' }, h('option', { value: '' }, 'Default'), profs.map(function (p) { return h('option', { value: p.id, selected: p.id === c.profile }, p.name); }));
                    return h('tr', {},
                        h('td', {}, num), h('td', {}, name, c.now ? h('div', { class: 'dh-small dh-muted' }, 'Now: ' + c.now.title + ' (' + fmtTime(c.now.start) + ')') : null),
                        h('td', {}, bars(c.signal)), h('td', {}, en),
                        h('td', { class: 'dh-small' }, (c.serviceNames || []).map(function (n, i) { return h('div', {}, h('span', { class: 'dh-badge' + (i ? '' : ' dh-acc') }, i ? 'backup' : 'primary'), ' ', n); })),
                        h('td', {}, prof),
                        h('td', {}, h('button', { class: 'dh-btn pri', onclick: function () {

                            ['serviceNames', 'now', 'next', 'streamUrl', 'signal'].forEach(function (k) { delete body[k]; });

            }

            fill($('#dhView'),
                h('div', { class: 'dh-row', style: 'margin-bottom:10px' }, q, h('span', { class: 'dh-sp' }),
                    h('button', { class: 'dh-btn', onclick: function () { act(api('POST', 'epg/automap'), function (r) { return 'Matched ' + r.mapped + ' channels to XMLTV'; }); } }, 'Auto-match XMLTV guide')),
                h('div', { class: 'dh-card dh-wrap', style: 'padding:0' }, h('table', { class: 'dh-t' },
                    h('thead', {}, h('tr', {}, ['#', 'Name', 'Signal', 'On', 'Sources', 'Profile', ''].map(function (x) { return h('th', {}, x); }))), tbody)),
                chans.length ? null : h('div', { class: 'dh-card dh-muted' }, 'No channels yet — scan on the Scan tab, then "Map all services".'));
        });
    };

    // ---------- scan ----------
    views.scan = function () {
        return Promise.all([get('networks'), get('muxes'), get('scanfiles').catch(function () { return []; }), get('status?history=0')]).then(function (res) {
            var nets = res[0] || [], muxes = res[1] || [], files = res[2] || [], st = res[3];
            var view = $('#dhView');
            var scanning = (st.scan.active || []).length + (st.scan.queued || []).length;
            var nName = h('input', { class: 'dh-in', placeholder: 'e.g. Freeview' });
            var nType = h('select', { class: 'dh-in' }, [['dvbt', 'DVB-T/T2 (antenna)'], ['dvbc', 'DVB-C (cable)'], ['dvbs', 'DVB-S/S2 (satellite)'], ['atsc', 'ATSC']].map(function (o) { return h('option', { value: o[0] }, o[1]); }));
            var optRadio = h('input', { type: 'checkbox' }), optFTA = h('input', { type: 'checkbox', checked: true });
            fill(view,
                scanning ? h('div', { class: 'dh-card' }, h('b', {}, 'Scanning… '), (st.scan.active || []).length + ' active, ' + (st.scan.queued || []).length + ' queued (refreshes automatically)') : null,
                h('div', { class: 'dh-card' }, h('h3', { style: 'margin-top:0' }, 'Add a network'),
                    h('div', { class: 'dh-form' }, h('label', { class: 'dh-f' }, 'Name', nName), h('label', { class: 'dh-f' }, 'Type', nType),
                        h('button', { class: 'dh-btn pri', onclick: function () { act(api('POST', 'networks', { name: nName.value, type: nType.value, discoverMuxes: true }), 'Network added').then(function () { show('scan'); }); } }, 'Add'))),
                h('div', { class: 'dh-card' }, h('h3', { style: 'margin-top:0' }, 'Create channels'),
                    h('div', { class: 'dh-row' }, h('label', { class: 'dh-row dh-small' }, optRadio, 'Include radio'), h('label', { class: 'dh-row dh-small' }, optFTA, 'Skip scrambled'),
                        h('button', { class: 'dh-btn pri', onclick: function () {
                            act(api('POST', 'map', { includeRadio: optRadio.checked, skipScrambled: optFTA.checked, mergeByName: true }), function (r) { return 'Created ' + r.created + ' channels, ' + r.merged + ' backups'; });
                        } }, 'Map all services'))));
            nets.forEach(function (n) {
                var mine = muxes.filter(function (m) { return m.networkId === n.id; });
                var fileSel = h('select', { class: 'dh-in', style: 'max-width:320px' }, h('option', { value: '' }, 'Import a scan table…'),
                    files.filter(function (f) { return f.indexOf('/' + ({ dvbt: 'dvb-t', dvbc: 'dvb-c', dvbs: 'dvb-s', atsc: 'atsc' }[n.type]) + '/') >= 0; })
                        .map(function (f) { return h('option', { value: f }, f.split('/').pop()); }));
                fileSel.addEventListener('change', function () {
                    if (!fileSel.value) return;
                    fetch(ApiClient.getUrl('DvbHub/Api/scanfile', { path: fileSel.value }), { headers: { 'Authorization': 'MediaBrowser Token="' + ApiClient.accessToken() + '"' } })
                        .then(function (r) { return r.text(); })
                        .then(function (txt) { return fetch(ApiClient.getUrl('DvbHub/Api/networks/' + n.id + '/import'), { method: 'POST', body: txt, headers: { 'Content-Type': 'text/plain', 'Authorization': 'MediaBrowser Token="' + ApiClient.accessToken() + '"' } }); })
                        .then(function (r) { return r.json(); })
                        .then(function (r) { toast('Imported ' + r.added + ' muxes; scanning'); show('scan'); });
                });
                view.appendChild(h('div', { class: 'dh-card' },
                    h('div', { class: 'dh-row' }, h('h3', { style: 'margin:0' }, n.name), h('span', { class: 'dh-badge' }, n.type), h('span', { class: 'dh-small dh-muted' }, n.muxes + ' muxes · ' + n.services + ' services'), h('span', { class: 'dh-sp' }),
                        n.type !== 'virtual' ? fileSel : null,
                        h('button', { class: 'dh-btn pri', onclick: function () { act(api('POST', 'networks/' + n.id + '/scan'), function (r) { return 'Scanning ' + r.queued + ' muxes'; }).then(function () { show('scan'); }); } }, 'Scan all')),
                    h('div', { class: 'dh-wrap' }, h('table', { class: 'dh-t', style: 'margin-top:8px' },
                        h('tr', {}, ['Mux', 'Signal', 'Services', 'Scan', ''].map(function (x) { return h('th', {}, x); })),
                        mine.map(function (m) {

    // ---------- align ----------

                        sp));

            fill($('#dhView'),
                h('div', { class: 'dh-card' },
                    h('div', { class: 'dh-small dh-muted', style: 'margin-bottom:10px' }, 'Holds one tuner on one mux and reads the signal 4× a second. Adjust the antenna or dish for the highest SNR. With the tone on, the pitch rises as quality improves and goes silent without lock.'),
                    h('div', { class: 'dh-form' }, h('label', { class: 'dh-f' }, 'Tuner', tSel), h('label', { class: 'dh-f' }, 'Mux', mSel), h('label', { class: 'dh-row' }, toneBox, '🔊 Tone'),

                        h('label', { class: 'dh-f' }, 'Rate control', f.rc), h('label', { class: 'dh-f' }, 'Bitrate kbit/s', f.br), h('label', { class: 'dh-f' }, 'Peak kbit/s', f.mr),

    // ---------- hardware ----------
    views.hardware = function (refresh) {
        return get('hardware' + (refresh ? '?refresh=1' : '')).then(function (d) {
            var r = d.report, inst = d.installer;
            var stBadge = function (s) { return h('span', { class: 'dh-badge ' + ({ working: 'dh-good', 'no-adapter': 'dh-warnb', 'no-driver': 'dh-badb' }[s] || '') }, { working: 'working', 'no-adapter': 'no adapter', 'no-driver': 'no driver' }[s] || s); };
            var view = $('#dhView');
            fill(view,
                h('div', { class: 'dh-card' }, h('div', { class: 'dh-row' }, h('h3', { style: 'margin:0' }, r.summary), h('span', { class: 'dh-sp' }), h('button', { class: 'dh-btn', onclick: function () { views.hardware(true); } }, 'Re-check')),
                    h('div', { class: 'dh-small dh-muted', style: 'margin-top:6px' }, 'Kernel ' + r.kernel + ' · Secure Boot ' + r.secureBoot + (r.container ? ' · dvbhub runs in a container' : '') + ' · adapters: ' + ((r.adapters || []).join(', ') || 'none')),

                            (dev.hints || []).length ? h('tr', {}, h('td', { colspan: 5, class: 'dh-small dh-muted' }, dev.hints.map(function (x) { return h('div', {}, '→ ' + x); }))) : null];

    function installer(inst, actions, suggested) {

    // ---------- setup ----------
    function addTuner(url, name) {
        // Uses Jellyfin's own Live TV API: add dvbhub as an HDHomeRun tuner and its XMLTV guide.
        var base = (config.DvbHubUrl || '').replace(/\/$/, '');
        return ApiClient.getNamedConfiguration('livetv').then(function (lt) {
            var hosts = lt.TunerHosts || [], provs = lt.ListingProviders || [];
            var jobs = [];
            if (!hosts.some(function (x) { return (x.Url || '').replace(/\/$/, '') === url; })) {
                jobs.push(ApiClient.ajax({ type: 'POST', url: ApiClient.getUrl('LiveTv/TunerHosts'), contentType: 'application/json',
                    data: JSON.stringify({ Type: 'hdhomerun', Url: url, FriendlyName: 'dvbhub ' + (name || ''), ImportFavoritesOnly: false, AllowHWTranscoding: true, EnableStreamLooping: false }) }));
            }
            if (!provs.some(function (x) { return x.Type === 'xmltv' && (x.Path || '') === base + '/xmltv.xml'; })) {
                jobs.push(ApiClient.ajax({ type: 'POST', url: ApiClient.getUrl('LiveTv/ListingProviders', { validateListings: false, validateLogin: false }), contentType: 'application/json',
                    data: JSON.stringify({ Type: 'xmltv', Path: base + '/xmltv.xml', EnableAllTuners: true }) }));
            }
            if (!jobs.length) { toast('Already added to Jellyfin Live TV.'); return; }
            return Promise.all(jobs).then(function () { toast('Added to Jellyfin Live TV. Jellyfin will refresh the guide shortly.'); });
        }).catch(function (e) { toast('Could not add to Live TV: ' + (e && e.message ? e.message : e)); });
    }

    views.setup = function () {
        var url = h('input', { class: 'dh-in', value: config.DvbHubUrl, style: 'min-width:280px' });
        var pw = h('input', { class: 'dh-in', type: 'password', value: config.AdminPassword, placeholder: '(none)' });
        var status = h('div', { class: 'dh-small', style: 'margin-top:10px' });

            config.DvbHubUrl = url.value.trim().replace(/\/$/, '');

            return ApiClient.updatePluginConfiguration(pluginId, config).then(function (r) { Dashboard.processPluginConfigurationUpdateResult(r); updateHeader(); });
        }
        function test() {
            status.textContent = 'Testing…';
            return get('status?history=0').then(function (st) {

                status),
            h('div', { class: 'dh-card' }, h('h3', { style: 'margin-top:0' }, 'Jellyfin Live TV'),
                h('div', { class: 'dh-small', style: 'margin-bottom:10px' }, 'Adds dvbhub to Jellyfin as an HDHomeRun tuner plus its XMLTV guide. Jellyfin then shows the channels under Live TV and records with its own DVR.'),
